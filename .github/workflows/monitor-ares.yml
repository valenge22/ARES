name: Monitoreo de disponibilidad ARES

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  healthcheck:
    name: Verificar servidor público
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar estado de ARES
        run: |
          curl --fail --show-error --silent \
            --connect-timeout 20 \
            --max-time 90 \
            --retry 1 --retry-delay 10 \
            https://controlares.com/health
