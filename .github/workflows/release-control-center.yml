name: Publicar ARES Centro de Control

on:
  workflow_dispatch:
  push:
    tags:
      - "control-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Crear instalador autónomo
        shell: powershell
        run: .\Crear-Paquete-Centro-Control.ps1

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ARES-Centro-Control-Windows-x64
          path: distribucion/ARES-Centro-Control-Windows-x64.zip

      - name: Crear GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "distribucion/ARES-Centro-Control-Windows-x64.zip#ARES-Centro-Control-Windows-x64.zip"
          --title "ARES Centro de Control ${{ github.ref_name }}"
          --notes "Instalador autónomo para Windows 10/11 x64. Descomprimir el ZIP y ejecutar INSTALAR-CENTRO-CONTROL.bat."
