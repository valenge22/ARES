name: Publicar ARES Agent

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Crear paquete autónomo
        shell: powershell
        env:
          ARES_UNINSTALL_PASSWORD: ${{ secrets.ARES_UNINSTALL_PASSWORD }}
        run: .\Crear-Paquete-Agente.ps1

      - name: Publicar artefacto del workflow
        uses: actions/upload-artifact@v4
        with:
          name: ARES-Agent-Remoto-Windows-x64
          path: |
            distribucion/ARES-Agent-Setup.exe
            distribucion/ARES-Agent-Windows-x64.zip

      - name: Crear GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "distribucion/ARES-Agent-Setup.exe#ARES-Agent-Setup.exe"
          "distribucion/ARES-Agent-Windows-x64.zip#ARES-Agent-Remoto-Windows-x64.zip"
          --title "ARES Agent ${{ github.ref_name }}"
          --notes "Instalador gráfico para Windows 10/11 x64. Descargar y ejecutar ARES-Agent-Setup.exe. El ZIP se conserva para diagnóstico."
