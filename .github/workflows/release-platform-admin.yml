name: Publicar ARES Administración
on:
  workflow_dispatch:
  push:
    tags:
      - "admin-v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Crear instalador privado
        shell: powershell
        run: .\Crear-Paquete-Administracion.ps1
      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: ARES-Administracion-Windows-x64
          path: |
            distribucion/ARES-Administracion-Setup.exe
            distribucion/ARES-Administracion-Windows-x64.zip
      - name: Crear GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "distribucion/ARES-Administracion-Setup.exe#ARES-Administracion-Setup.exe"
          "distribucion/ARES-Administracion-Windows-x64.zip#ARES-Administracion-Windows-x64.zip"
          --title "ARES Administración ${{ github.ref_name }}"
          --notes "Aplicación privada para administrar clientes y licencias de la plataforma ARES."
